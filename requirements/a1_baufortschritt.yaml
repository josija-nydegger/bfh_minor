# Regeln für Anforderung 1 (und Formatteil von Anforderung 2), Quelle für a1_baufortschritt.ids
# Erzeugt mit: node requirements/erzeuge_ids.js (nicht von Hand ändern, sondern das Script anpassen)
#
# Geltungsbereich laut AIA/BEP-Matrix: alle IfcElement ohne IfcOpeningElement.
# IDS 1.0 prüft beim Entity-Facet nur die genannte Klasse (keine Subtypen). Darum steht in jeder
# Regel die Liste aller 45 Bauteilklassen von IFC2X3. IDS-Light kennt keine Klassenlisten,
# darum erzeugt das Script das IDS direkt.
#
# Datum als IfcLabel (IFC2X3 kennt kein IfcDate), Format YYYY-MM-DD per Pattern.
# Das Pattern ist ein XSD-Regex: implizit verankert, darum ohne ^ und $.
# IsInstalled als boolean (-> IFCBOOLEAN).

ids:
  title: "Baufortschritt - Soll-Installationsdatum, Montagestatus und Abnahmedatum"
  description: "Anforderung 1: InstallationDate (Soll-Datum gemäss Terminplan) vorhanden und im Format YYYY-MM-DD; IsInstalled vorhanden und IfcBoolean. Anforderung 2 (nur Format): AcceptanceDate, falls gesetzt, im Format YYYY-MM-DD. Gilt für alle 45 Bauteilklassen von IFC2X3."
  date: "2026-11-04"
  ifcVersion: "IFC2X3"
  entities: &bauteile
    - "IfcBeam"
    - "IfcBuildingElementProxy"
    - "IfcColumn"
    - "IfcCovering"
    - "IfcCurtainWall"
    - "IfcDoor"
    - "IfcFooting"
    - "IfcMember"
    - "IfcPile"
    - "IfcPlate"
    - "IfcRailing"
    - "IfcRamp"
    - "IfcRampFlight"
    - "IfcRoof"
    - "IfcSlab"
    - "IfcStair"
    - "IfcStairFlight"
    - "IfcWall"
    - "IfcWallStandardCase"
    - "IfcWindow"
    - "IfcBuildingElementPart"
    - "IfcReinforcingBar"
    - "IfcReinforcingMesh"
    - "IfcTendon"
    - "IfcTendonAnchor"
    - "IfcDiscreteAccessory"
    - "IfcFastener"
    - "IfcMechanicalFastener"
    - "IfcDistributionElement"
    - "IfcDistributionControlElement"
    - "IfcDistributionFlowElement"
    - "IfcDistributionChamberElement"
    - "IfcEnergyConversionDevice"
    - "IfcFlowController"
    - "IfcFlowFitting"
    - "IfcFlowMovingDevice"
    - "IfcFlowSegment"
    - "IfcFlowStorageDevice"
    - "IfcFlowTerminal"
    - "IfcFlowTreatmentDevice"
    - "IfcElementAssembly"
    - "IfcFurnishingElement"
    - "IfcTransportElement"
    - "IfcElectricalElement"
    - "IfcEquipmentElement"
  rules:
    - name: "A1 InstallationDate"
      entities: *bauteile
      properties:
        - name: "Pset_InstallationOccurrence.InstallationDate"
          datatype: "string"
          presence: "required"
          pattern: "[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])"
          instructions: "Soll-Datum der Installation gemäss Terminplan im Format YYYY-MM-DD; wird nach der Übergabe nicht verändert"
    - name: "A1 IsInstalled"
      entities: *bauteile
      properties:
        - name: "Pset_InstallationOccurrence.IsInstalled"
          datatype: "boolean"
          presence: "required"
          instructions: "Montagestatus: initial FALSE (Modellautor), TRUE nach Montage-Rückmeldung des Poliers"
    - name: "A2 AcceptanceDate"
      entities: *bauteile
      properties:
        - name: "Pset_InstallationOccurrence.AcceptanceDate"
          datatype: "string"
          presence: "optional"
          pattern: "[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])"
          instructions: "Abnahmedatum der Bauleitung im Format YYYY-MM-DD; leer = noch nicht abgenommen"
