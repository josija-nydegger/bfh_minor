<title>Baukontrolle Demo</title>

<style>
/* Layout: Kopfleiste / 3D-Bühne / Sheet unten (Handy) bzw. Panel rechts (Desktop) */
:root {
  --ink: #1b2127; --ink-2: #48525c; --muted: #6a7480;
  --bg: #f3f4f5; --stage: #e8ebee; --card: #ffffff; --line: #dce0e4; --soft: #eef0f2;
  --bar: #1b2127; --bar-fg: #ffffff; --bar-muted: #a9b2bb;
  --signal: #5b5a55; --signal-ink: #1b2127;
  --accent: #1c7ed6; --ok: #2b9348; --ok-soft: #e6f4ea; --ok-ink: #1d6b33;
  --warn-ink: #a85f00; --bad: #d62828; --violet: #7b2cbf;
  --glass: rgba(255,255,255,.9);
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #e9edf1; --ink-2: #c3cad1; --muted: #8f99a4;
  --bg: #14181c; --stage: #1c2228; --card: #1f252b; --line: #323a42; --soft: #282f36;
  --bar: #0e1114; --bar-fg: #ffffff; --bar-muted: #8f99a4;
  --ok-soft: #1c3424; --ok-ink: #7fd99a; --warn-ink: #ffb347; --glass: rgba(31,37,43,.92);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --ink: #e9edf1; --ink-2: #c3cad1; --muted: #8f99a4;
  --bg: #14181c; --stage: #1c2228; --card: #1f252b; --line: #323a42; --soft: #282f36;
  --bar: #0e1114; --bar-fg: #ffffff; --bar-muted: #8f99a4;
  --ok-soft: #1c3424; --ok-ink: #7fd99a; --warn-ink: #ffb347; --glass: rgba(31,37,43,.92);
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; height: 100%; }
.topbar { display: flex; align-items: center; gap: 8px; background: var(--bar); color: var(--bar-fg);
  padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--signal); display: grid; place-items: center; flex: none; }
.logo svg { width: 20px; height: 20px; }
.brand > div:last-child { min-width: 0; }
.brand h1 { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-display); font-size: 20px; letter-spacing: .02em; line-height: 1; }
.brand p { margin: 2px 0 0; font-size: 12px; color: var(--bar-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { min-width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; font-size: 24px; line-height: 1; display: grid; place-items: center; padding: 0; }
.topbar .icon-btn { color: var(--bar-fg); }
.day { display: flex; align-items: center; }
.day-pill { min-width: 86px; height: 42px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: var(--bar-fg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; }
.day-pill b { font-family: var(--f-display); font-size: 17px; line-height: 1.05; letter-spacing: .02em; }
.day-pill small { font-size: 11px; color: var(--bar-muted); }
.day-pill.today { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
.day-pill.today small { color: #5c4a00; }
.tabbtn { height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: transparent; color: var(--bar-fg); font-weight: 600; font-size: 14px; }
.tabbtn.on { background: var(--bar-fg); color: var(--bar); }

.demo-note { font-size: 12.5px; color: var(--ink-2); background: var(--soft); border-bottom: 1px solid var(--line);
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.stage { position: relative; min-height: 0; overflow: hidden; background: var(--stage); }
#cv { display: block; width: 100%; height: 100%; touch-action: none; }
.overlay { position: absolute; inset: 0 0 auto 0; display: flex; flex-direction: column; gap: 8px; padding: 10px;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.overlay > * { pointer-events: auto; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 38px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--glass); font-weight: 600; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { min-width: 22px; padding: 1px 6px; border-radius: 999px; background: var(--soft); color: var(--ink); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
.chip.on .n { background: var(--ink-2); color: var(--bg); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.seg { align-self: flex-start; display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px; border: 1px solid var(--line); background: var(--glass); }
.seg button { height: 32px; min-width: 44px; border: 0; border-radius: 8px; background: none; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.seg button.on { background: var(--ink); color: var(--bg); }
.tools { flex-direction: row; flex-wrap: wrap; }
.tool { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass); font-weight: 600; font-size: 14px; }
.tool.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.legend { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 6px 10px; border-radius: 10px;
  background: var(--glass); font-size: 12px; color: var(--ink-2); pointer-events: none; max-width: calc(100% - 20px); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.loading { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--ink-2); padding: 20px; }

.sheet { background: var(--card); border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.12); display: flex; flex-direction: column; min-height: 0; max-height: 46vh; z-index: 10;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.app.sel .sheet { max-height: 58vh; }
.app.collapsed .sheet { max-height: none; }
.handle { height: 22px; border: 0; background: none; display: grid; place-items: center; flex: none; }
.handle span { width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
.inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head { padding-bottom: 10px; cursor: pointer; flex: none; }
.head h2 { margin: 0; font-family: var(--f-display); font-size: 21px; letter-spacing: .01em; }
.muted { color: var(--muted); font-weight: 500; }
.prog { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.bar { flex: 1; height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--ok); transition: width .3s; }
.prog small { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 0; padding: 0 8px 8px; overflow-y: auto; border-top: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
.row { width: 100%; min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 8px; border: 0; border-bottom: 1px solid var(--soft); background: none; text-align: left; }
.row:hover { background: var(--soft); }
.rm { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.rm b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rm small { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { font-size: 13px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.c-eingebaut { color: var(--ok-ink); } .c-ueberfaellig { color: var(--bad); } .c-faellig { color: var(--warn-ink); } .c-mangel { color: var(--violet); }
.empty { padding: 24px 12px; text-align: center; color: var(--muted); }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 8px; }

.detail { overflow-y: auto; padding-bottom: 16px; }
.dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.dh h2 { margin: 6px 0 2px; font-family: var(--f-display); font-size: 24px; line-height: 1.1; overflow-wrap: anywhere; }
.dh p { margin: 0; font-size: 13px; }
.badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .03em; color: #fff; }
.stepper { display: flex; align-items: center; color: var(--muted); flex: none; }
.stepper .icon-btn { background: var(--soft); color: var(--ink); }
.stepper small { min-width: 46px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.primary { width: 100%; min-height: 56px; margin: 14px 0 6px; border: 0; border-radius: var(--r); background: var(--ok); color: #fff;
  font-family: var(--f-display); font-size: 21px; letter-spacing: .02em; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 3px 0 #1d6b33; }
.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #1d6b33; }
.primary small { font-family: var(--f-body); font-size: 13px; opacity: .85; }
.done { min-height: 56px; margin: 14px 0 6px; padding: 0 6px 0 16px; border-radius: var(--r); background: var(--ok-soft); color: var(--ok-ink); font-weight: 700; display: flex; align-items: center; justify-content: space-between; }
.props { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
.props caption { text-align: left; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding-bottom: 4px; }
.props th { width: 38%; text-align: left; font-weight: 500; color: var(--ink-2); padding: 8px 8px 8px 0; border-top: 1px solid var(--soft); vertical-align: middle; }
.props td { padding: 6px 0; border-top: 1px solid var(--soft); overflow-wrap: anywhere; }
.props input, .props select, .props textarea { width: 100%; min-height: 42px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 16px; }
.props.small { font-size: 12.5px; }
.more { margin-top: 10px; border: 0; background: none; padding: 8px 0; font-weight: 600; color: var(--ink-2); }
code { font-size: 12px; background: var(--soft); padding: 2px 6px; border-radius: 6px; user-select: all; }

/* Hintergrund-Tabelle */
.tablewrap { overflow: auto; flex: 1; min-height: 0; border-top: 1px solid var(--line); }
.gt { border-collapse: collapse; font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.gt th, .gt td { padding: 7px 10px; border-bottom: 1px solid var(--soft); text-align: left; }
.gt th { position: sticky; top: 0; background: var(--card); color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
.gt tr.chg td { background: var(--ok-soft); }
.gt td.guid { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.tbl-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 10px; }
.btn2 { height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 13.5px; }
.btn2.danger { color: var(--bad); }
.csv { width: 100%; height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); padding: 8px; margin-bottom: 10px; }

@media (min-width: 900px) {
  .app { grid-template-columns: 1fr 420px; grid-template-rows: auto auto 1fr; }
  .topbar, .demo-note { grid-column: 1 / -1; }
  .stage { grid-column: 1; grid-row: 3; }
  .sheet, .app.sel .sheet, .app.collapsed .sheet { grid-column: 2; grid-row: 3; max-height: none; border-radius: 0; box-shadow: none; border-left: 1px solid var(--line); }
  .handle { display: none; }
  .head, .detail { padding-top: 16px; }
  .app.tablemode { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 440px) {
  .brand p { display: none; }
  .brand h1 { font-size: 18px; }
  .day-pill { min-width: 72px; padding: 0 6px; }
  .topbar .icon-btn { min-width: 32px; }
  .tabbtn { padding: 0 9px; }
}
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>

cv.addEventListener('pointerdown', e => { down = e.isPrimary ? { x: e.clientX, y: e.clientY, t: performance.now() } : null; });
cv.addEventListener('pointerup', e => {
  if (!down || !e.isPrimary) return; if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8 || performance.now() - down.t > 600) return;
  const r = cv.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const hit = ray.intersectObjects(all.filter(m => m.visible && !m.userData.ghost), false)[0];
  if (hit) select(hit.object.userData.k);
});

// ── Abgeleitete Daten ──
const inStorey = el => S.storey === 'alle' || el.s === S.storey;
function rows() { return els.map((el, k) => { const f = eff(el); return { el, k, f, c: cat(f, S.day) }; }); }
function matches(r) {
  if (S.filter === 'tag') return r.f.planned === S.day || (r.c === 'eingebaut' && r.f.installed === S.day);
  if (S.filter === 'ueberfaellig') return r.c === 'ueberfaellig' || r.c === 'mangel';
  if (S.filter === 'eingebaut') return r.c === 'eingebaut';
  return true;
}
const ORDER = ['ueberfaellig', 'mangel', 'faellig', 'spaeter', 'ohne', 'eingebaut'];
function listRows(R) {
  return R.filter(r => inStorey(r.el) && matches(r)).sort((a, b) => ORDER.indexOf(a.c) - ORDER.indexOf(b.c) || a.f.planned.localeCompare(b.f.planned) || a.el.n.localeCompare(b.el.n, 'de', { numeric: true }));
}

// ── 3D-Darstellung ──
const SEL = new THREE.Color('#1c7ed6'), GHOST = new THREE.Color('#9aa3ad');
function paint(R) {
  R.forEach(r => {
    let look = 'normal';
    if (r.k === S.sel) look = 'sel'; else if (S.sel != null && S.iso) look = 'ghost'; else if (!inStorey(r.el)) look = 'hidden'; else if (!matches(r)) look = 'ghost';
    meshesOf.get(r.k).forEach(m => {
      const mat = m.material; m.visible = look !== 'hidden'; m.userData.ghost = look === 'ghost'; m.renderOrder = look === 'sel' ? 2 : look === 'ghost' ? 1 : 0;
      mat.emissive.setRGB(0, 0, 0);
      let op = 1;
      if (look === 'sel') { mat.color.copy(SEL); mat.emissive.copy(SEL).multiplyScalar(.25); }
      else if (look === 'ghost') { mat.color.copy(GHOST); op = .07; }
      else { mat.color.set(COLORS[r.c]); op = m.userData.alpha < 1 ? Math.max(m.userData.alpha, .45) : 1; }
      const tr = op < 1; if (mat.transparent !== tr) mat.needsUpdate = true; mat.transparent = tr; mat.opacity = op; mat.depthWrite = !tr;
    });
  });
}

// ── Oberfläche ──
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const typ = t => TYPE[t] || t.replace(/^Ifc/, '');
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }

function update(el, patch) {
  const f = eff(el);
  table[el.g] = Object.assign({ status: f.status, installationDate: f.installed || '', note: f.note || '' }, patch, { updatedAt: new Date().toISOString() });
  save(); render();
}

function select(k) {
  S.sel = k; S.iso = true; S.open = true; S.moreOpen = false; S.table = false; render();
  requestAnimationFrame(() => requestAnimationFrame(() => fit(boxOf([k]), true, 1.8)));
}
function back() { S.sel = null; render(); fit(boxOf(els.map((e, k) => k).filter(k => inStorey(els[k]))), true, .95); }

function render() {
  const R = rows(), L = listRows(R);
  const app = $('app');
  app.classList.toggle('sel', S.sel != null); app.classList.toggle('collapsed', !S.open); app.classList.toggle('tablemode', S.table);
  const isToday = S.day === TODAY;
  $('dMain').textContent = isToday ? 'Heute' : short(S.day);
  $('dSub').textContent = isToday ? short(S.day) : 'Stichtag';
  $('dPill').classList.toggle('today', isToday);
  $('tblBtn').classList.toggle('on', S.table); $('tblBtn').setAttribute('aria-pressed', S.table);
  $('ovList').hidden = S.sel != null; $('ovSel').hidden = S.sel == null; $('legend').hidden = S.sel != null;
  $('bIso').classList.toggle('on', S.iso); $('bIso').textContent = S.iso ? 'Isoliert' : 'Isolieren';

  const SR = R.filter(r => inStorey(r.el)), dayR = SR.filter(r => r.f.planned === S.day);
  const cnt = { tag: dayR.length, done: dayR.filter(r => r.c === 'eingebaut').length, ueberfaellig: SR.filter(r => r.c === 'ueberfaellig' || r.c === 'mangel').length, eingebaut: SR.filter(r => r.c === 'eingebaut').length, alle: SR.length };
  const chip = (id, label, n, tone) => `<button class="chip ${S.filter === id ? 'on' : ''}" data-f="${id}">${tone ? `<span class="dot" style="background:${COLORS[tone]}"></span>` : ''}${label}<span class="n">${n}</span></button>`;
  $('chips').innerHTML = chip('tag', isToday ? 'Heute' : short(S.day), cnt.tag, 'faellig') + chip('ueberfaellig', 'Überfällig', cnt.ueberfaellig, 'ueberfaellig') + chip('eingebaut', 'Eingebaut', cnt.eingebaut, 'eingebaut') + chip('alle', 'Alle', cnt.alle);
  $('seg').innerHTML = ['alle', ...storeys].map(s => `<button data-s="${esc(s)}" class="${S.storey === s ? 'on' : ''}">${s === 'alle' ? 'Alle' : esc(STOREY_ABBR[s] || s)}</button>`).join('');
  $('legend').innerHTML = ['faellig', 'ueberfaellig', 'eingebaut', 'mangel'].map(c => `<span><i style="background:${COLORS[c]}"></i>${CAT_LABEL[c]}</span>`).join('');

  const body = $('sheetBody');
  if (S.table) body.innerHTML = tableView(R);
  else if (S.sel != null) body.innerHTML = detailView(R[S.sel], L);
  else body.innerHTML = listView(L, cnt, isToday, R);
  paint(R);
}

function listView(L, cnt, isToday, R) {
  const title = S.filter === 'tag' ? `${isToday ? 'Heute' : short(S.day)} geplant<span class="muted"> · ${cnt.tag} Bauteile</span>`
    : `${{ ueberfaellig: 'Überfällig & Mängel', eingebaut: 'Eingebaut', alle: 'Alle Bauteile' }[S.filter]}<span class="muted"> · ${L.length}</span>`;
  const pct = cnt.tag ? Math.round(cnt.done / cnt.tag * 100) : 0;
  let h = `<div class="head inner" data-a="toggle"><h2>${title}</h2>${S.filter === 'tag' ? `<div class="prog"><div class="bar"><span style="width:${pct}%"></span></div><small>${cnt.done} von ${cnt.tag} erledigt</small></div>` : ''}</div>`;
  if (!S.open) return h;
  h += '<ul class="list">';
  if (!L.length) {
    const next = R.map(r => r.f.planned).filter(p => p && p > S.day).sort()[0];
    h += `<li class="empty"><p>${S.filter === 'tag' ? `Für ${short(S.day)} ist nichts geplant.` : 'Keine Bauteile in dieser Ansicht.'}</p>${S.filter === 'tag' && next ? `<button class="link" data-day="${next}">Nächster Termin: ${short(next)} ›</button>` : ''}</li>`;
  }
  L.forEach(r => {
    const meta = r.c === 'eingebaut' ? `✓ ${short(r.f.installed)}` : r.c === 'mangel' ? 'Mangel' : short(r.f.planned);
    h += `<li><button class="row" data-k="${r.k}"><span class="dot" style="background:${COLORS[r.c]}"></span><span class="rm"><b>${esc(r.el.n)}</b><small>${typ(r.el.t)} · ${esc(r.el.s)} · ${esc(r.el.ph)}</small></span><span class="meta c-${r.c}">${meta}</span></button></li>`;
  });
  return h + '</ul>';
}

function detailView(r, L) {
  const { el, f, c } = r; const pos = L.findIndex(x => x.k === r.k);
  const light = c === 'spaeter' || c === 'ohne';
  let h = `<div class="detail inner"><div class="dh"><div><span class="badge" style="background:${COLORS[c]};${light ? 'color:#1b2127' : ''}">${CAT_LABEL[c]}</span><h2>${esc(el.n)}</h2><p class="muted">${typ(el.t)} · ${esc(el.s)} · ${esc(el.ph)}</p></div>
    <div class="stepper"><button class="icon-btn" data-a="prev" aria-label="Vorheriges Bauteil">‹</button><small>${pos >= 0 ? pos + 1 : '–'} / ${L.length}</small><button class="icon-btn" data-a="next" aria-label="Nächstes Bauteil">›</button></div></div>`;
  h += f.status === 'eingebaut'
    ? `<div class="done"><span>✓ Eingebaut am ${ch(f.installed)}</span><button class="link" data-a="undo">Rückgängig</button></div>`
    : `<button class="primary" data-a="installed">✓ Heute eingebaut <small>${ch(TODAY)}</small></button>`;
  h += `<table class="props"><caption>Pset_Baukontrolle</caption><tbody>
    <tr><th>Geplant</th><td>${ch(f.planned)}</td></tr>
    <tr><th><label for="fInst">Eingebaut am</label></th><td><input id="fInst" type="date" value="${f.installed || ''}"></td></tr>
    <tr><th><label for="fStat">Status</label></th><td><select id="fStat">${['geplant', 'eingebaut', 'mangel'].map(s => `<option value="${s}" ${f.status === s ? 'selected' : ''}>${s === 'mangel' ? 'Mangel' : s}</option>`).join('')}</select></td></tr>
    <tr><th><label for="fNote">Bemerkung</label></th><td><textarea id="fNote" rows="2" placeholder="z. B. Auflager fehlt">${esc(f.note)}</textarea></td></tr>
  </tbody></table>
  <button class="more" data-a="more">${S.moreOpen ? '▾' : '▸'} Weitere Eigenschaften</button>`;
  if (S.moreOpen) {
    h += `<p class="muted" style="font-size:12px">GlobalId <code>${esc(el.g)}</code></p>`;
    el.ps.forEach(([name, props]) => { h += `<table class="props small"><caption>${esc(name)}</caption><tbody>${props.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v === 'true' ? 'Ja' : v === 'false' ? 'Nein' : v)}</td></tr>`).join('')}</tbody></table>`; });
  }
  return h + '</div>';
}

function csvText(R) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  return ['GlobalId;Name;Typ;Geschoss;Geplant;Eingebaut;Status;Bemerkung'].concat(R.map(r => [r.el.g, r.el.n, typ(r.el.t), r.el.s, r.f.planned, r.f.installed, r.f.status, r.f.note].map(q).join(';'))).join('\n');
}
function tableView(R) {
  const changed = R.filter(r => r.f.changed).length;
  let h = `<div class="head inner" style="cursor:default"><h2>Tabelle im Hintergrund<span class="muted"> · ${R.length} Zeilen, ${changed} geändert</span></h2>
    <p class="muted" style="margin:6px 0 10px;font-size:13px">Eine Zeile pro GlobalId. Grün = vom Polier geändert. In der echten App läge diese Tabelle in einer Datenbank.</p>
    <div class="tbl-actions"><button class="btn2" data-a="copy">CSV kopieren</button>${S.confirmReset ? `<button class="btn2 danger" data-a="resetYes">Wirklich alles zurücksetzen</button><button class="btn2" data-a="resetNo">Abbrechen</button>` : `<button class="btn2 danger" data-a="reset">Änderungen zurücksetzen</button>`}</div>
    <textarea class="csv" id="csvOut" readonly hidden></textarea></div>`;
  h += `<div class="tablewrap"><table class="gt"><thead><tr><th>GlobalId</th><th>Name</th><th>Status</th><th>Geplant</th><th>Eingebaut</th><th>Bemerkung</th></tr></thead><tbody>`;
  [...R].sort((a, b) => (b.f.changed - a.f.changed) || a.f.planned.localeCompare(b.f.planned)).forEach(r => {
    h += `<tr class="${r.f.changed ? 'chg' : ''}" data-k="${r.k}"><td class="guid">${esc(r.el.g)}</td><td>${esc(r.el.n)}</td><td class="c-${r.c}">${esc(r.f.status)}</td><td>${r.f.planned}</td><td>${r.f.installed || ''}</td><td>${esc(r.f.note)}</td></tr>`;
  });
  return h + '</tbody></table></div>';
}

// ── Ereignisse ──
document.addEventListener('click', e => {
  const t = e.target.closest('[data-f],[data-s],[data-k],[data-a],[data-day]'); if (!t) return;
  const R = rows(), L = listRows(R);
  if (t.dataset.f) { S.filter = t.dataset.f; render(); return; }
  if (t.dataset.s) { S.storey = t.dataset.s; render(); fit(boxOf(els.map((x, k) => k).filter(k => inStorey(els[k]))), true, .95); return; }
  if (t.dataset.day) { S.day = t.dataset.day; render(); return; }
  if (t.dataset.k != null && t.dataset.a == null) { select(+t.dataset.k); return; }
  const a = t.dataset.a, el = S.sel != null ? els[S.sel] : null;
  if (a === 'toggle') { if (innerWidth < 900) { S.open = !S.open; render(); } }
  else if (a === 'installed') { update(el, { status: 'eingebaut', installationDate: TODAY }); toast(`${el.n}: eingebaut ✓`); }
  else if (a === 'undo') { update(el, { status: 'geplant', installationDate: '' }); toast('Zurückgesetzt'); }
  else if (a === 'prev' || a === 'next') { const i = L.findIndex(x => x.k === S.sel); const n = L[(i + (a === 'next' ? 1 : -1) + L.length) % L.length]; if (n) select(n.k); }
  else if (a === 'more') { S.moreOpen = !S.moreOpen; render(); }
  else if (a === 'copy') { const txt = csvText(R); const box = $('csvOut'); box.value = txt; box.hidden = false;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('CSV kopiert'), () => { box.select(); toast('Text markiert – bitte kopieren'); }); }
  else if (a === 'reset') { S.confirmReset = true; render(); }
  else if (a === 'resetNo') { S.confirmReset = false; render(); }
  else if (a === 'resetYes') { table = {}; save(); S.confirmReset = false; render(); toast('Alle Änderungen verworfen'); }
});
document.addEventListener('change', e => {
  if (S.sel == null) return; const el = els[S.sel], f = eff(el);
  if (e.target.id === 'fInst') { const v = e.target.value; update(el, { installationDate: v, status: v ? 'eingebaut' : (f.status === 'eingebaut' ? 'geplant' : f.status) }); }
  if (e.target.id === 'fStat') { const s = e.target.value; update(el, { status: s, installationDate: s === 'eingebaut' ? (f.installed || TODAY) : s === 'geplant' ? '' : (f.installed || '') }); }
  if (e.target.id === 'fNote') update(el, { note: e.target.value });
});
$('bBack').onclick = back;
$('bIso').onclick = () => { S.iso = !S.iso; render(); };
$('bZoom').onclick = () => S.sel != null && fit(boxOf([S.sel]), true, 1.8);
$('dPrev').onclick = () => { S.day = addDays(S.day, -1); render(); };
$('dNext').onclick = () => { S.day = addDays(S.day, 1); render(); };
$('dPill').onclick = () => { S.day = TODAY; render(); };
$('tblBtn').onclick = () => { S.table = !S.table; if (S.table) S.open = true; render(); };
$('handle').onclick = () => { if (innerWidth < 900) { S.open = !S.open; render(); } };

$('loading').hidden = true;
render();
})();
</script>

</body></html>
